<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerHub Job Portal</title><link rel="stylesheet" href="style.css"></head><body><header><h1>CareerHub</h1><p>Job Portal — beginner front-end prototype</p></header><main><section class="card"><h2>Find a role</h2><input id="search" placeholder="Search job title or skill"><div id="jobs"></div></section><section class="card"><h2>Application form</h2><form id="apply"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Job title<input id="role" required readonly placeholder="Choose Apply on a job"></label><button>Submit demo application</button></form><p id="message" aria-live="polite"></p><h3>Demo applications</h3><ul id="applications"></ul></section></main><footer>Demo only — applications are not sent to real employers.</footer><script src="script.js"></script></body></html>
